experiments:
  - id: phase0-deepdive-proof-point
    status: planned
    config: configs/experiments/phase0_baseline.yaml
    record: docs/records/2026-05-14-project-bootstrap.md
    purpose: >
      Define the first 0-4 week diagnostic proof point for primitive collision contracts.
    claims_supported:
      - bootstrap proposal only
  - id: newton-drop-settle-bed-smoke
    status: complete
    config: configs/experiments/newton_drop_settle.yaml
    record: docs/records/2026-05-14-newton-drop-settle.md
    purpose: >
      Run the first task-level Newton drop/settle smoke over the CPD-like bed collision package.
    claims_supported:
      - named capped-bed drop/settle task smoke only
      - no benchmark, broad asset/task, collision-quality, or CPD reproduction claim
  - id: newton-sphere-rain-bed-smoke
    status: complete
    config: configs/experiments/newton_sphere_rain.yaml
    record: docs/records/2026-05-15-newton-sphere-rain.md
    purpose: >
      Run the second task-level Newton smoke over the CPD-like bed collision package using a
      sphere-rain contact-density proxy.
    claims_supported:
      - named capped-bed sphere-rain contact-density proxy smoke only
      - no benchmark, broad asset/task, collision-quality, real contact-stress, or CPD reproduction claim
  - id: franka-cpd-like-smoke
    status: complete
    config: configs/experiments/franka_cpd_like_smoke.yaml
    record: docs/records/2026-05-15-franka-cpd-like-smoke.md
    purpose: >
      Open the local Franka USD and run capped first-mesh CPD-like geometry smoke as a second
      asset-class intake check.
    claims_supported:
      - Franka USD-open and capped first-mesh CPD-like geometry smoke only
      - no whole-robot collider-quality, articulated-dynamics, aggregate, benchmark, or CPD reproduction claim
  - id: cpd-like-component-merge-gate-bed-smoke
    status: complete
    config: configs/experiments/cpd_like_component_merge_gate.yaml
    record: docs/records/2026-05-15-cpd-like-component-merge-gate.md
    purpose: >
      Run the opt-in CPD-like component-merge gate over the capped bed geometry smoke and report
      merge policy, component counts, and normalized excess-volume accounting.
    claims_supported:
      - geometry-only CPD-like component-merge gate smoke only
      - no collision-quality, benchmark, broad asset/task, or full CPD reproduction claim
  - id: cpd-like-objective-report-bed-smoke
    status: complete
    config: configs/experiments/cpd_like_objective_report.yaml
    record: docs/records/2026-05-15-cpd-like-objective-report.md
    purpose: >
      Run the offline paper-aligned surrogate objective report over the capped bed CPD-like
      baseline and record primitive budget, volume proxy, merge-excess accounting,
      assigned-point containment proxy, unsupported paper primitive gaps, and component labels.
    claims_supported:
      - offline CPD-like objective diagnostic smoke only
      - no collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
  - id: cpd-like-synthetic-objective-comparison
    status: complete
    command: PYTHONPATH=src python -m primitive_collision_compiler.cli --run-cpd-like-synthetic-comparison
    record: docs/records/2026-05-15-cpd-like-synthetic-comparison.md
    purpose: >
      Run command-only deterministic synthetic fixtures for topology-only versus component-merge
      objective accounting. This entry intentionally has no config because the meshes are
      in-memory fixtures defined in source.
    claims_supported:
      - synthetic CPD-like objective diagnostic comparison only
      - no collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
