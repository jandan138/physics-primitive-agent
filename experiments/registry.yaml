experiments:
  - id: phase0-deepdive-proof-point
    status: planned
    config: configs/experiments/phase0_baseline.yaml
    record: docs/records/2026-05-14-project-bootstrap.md
    purpose: >
      Define the first 0-4 week diagnostic proof point for primitive collision contracts.
    claims_supported:
      - bootstrap proposal only
  - id: newton-drop-settle-bed-smoke
    status: complete
    config: configs/experiments/newton_drop_settle.yaml
    record: docs/records/2026-05-14-newton-drop-settle.md
    purpose: >
      Run the first task-level Newton drop/settle smoke over the CPD-like bed collision package.
    claims_supported:
      - named capped-bed drop/settle task smoke only
      - no benchmark, broad asset/task, collision-quality, or CPD reproduction claim
  - id: newton-sphere-rain-bed-smoke
    status: complete
    config: configs/experiments/newton_sphere_rain.yaml
    record: docs/records/2026-05-15-newton-sphere-rain.md
    purpose: >
      Run the second task-level Newton smoke over the CPD-like bed collision package using a
      sphere-rain contact-density proxy.
    claims_supported:
      - named capped-bed sphere-rain contact-density proxy smoke only
      - no benchmark, broad asset/task, collision-quality, real contact-stress, or CPD reproduction claim
  - id: franka-cpd-like-smoke
    status: complete
    config: configs/experiments/franka_cpd_like_smoke.yaml
    record: docs/records/2026-05-15-franka-cpd-like-smoke.md
    purpose: >
      Open the local Franka USD and run capped first-mesh CPD-like geometry smoke as a second
      asset-class intake check.
    claims_supported:
      - Franka USD-open and capped first-mesh CPD-like geometry smoke only
      - no whole-robot collider-quality, articulated-dynamics, aggregate, benchmark, or CPD reproduction claim
  - id: cpd-like-component-merge-gate-bed-smoke
    status: complete
    config: configs/experiments/cpd_like_component_merge_gate.yaml
    record: docs/records/2026-05-15-cpd-like-component-merge-gate.md
    purpose: >
      Run the opt-in CPD-like component-merge gate over the capped bed geometry smoke and report
      merge policy, component counts, and normalized excess-volume accounting.
    claims_supported:
      - geometry-only CPD-like component-merge gate smoke only
      - no collision-quality, benchmark, broad asset/task, or full CPD reproduction claim
  - id: cpd-like-objective-report-bed-smoke
    status: complete
    config: configs/experiments/cpd_like_objective_report.yaml
    record: docs/records/2026-05-15-cpd-like-objective-report.md
    purpose: >
      Run the offline paper-aligned surrogate objective report over the capped bed CPD-like
      baseline and record primitive budget, volume proxy, merge-excess accounting,
      assigned-point containment proxy, unsupported paper primitive gaps, and component labels.
    claims_supported:
      - offline CPD-like objective diagnostic smoke only
      - no collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
  - id: cpd-like-synthetic-objective-comparison
    status: complete
    command: PYTHONPATH=src python -m primitive_collision_compiler.cli --run-cpd-like-synthetic-comparison
    record: docs/records/2026-05-15-cpd-like-synthetic-comparison.md
    purpose: >
      Run command-only deterministic synthetic fixtures for topology-only versus component-merge
      objective accounting. This entry intentionally has no config because the meshes are
      in-memory fixtures defined in source.
    claims_supported:
      - synthetic CPD-like objective diagnostic comparison only
      - no collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
  - id: cpd-like-cost-guided-synthetic-comparison
    status: complete
    command: PYTHONPATH=src python -m primitive_collision_compiler.cli --run-cpd-like-cost-guided-synthetic-comparison
    record: docs/records/2026-05-15-cpd-like-cost-guided-merge.md
    purpose: >
      Run a command-only deterministic synthetic fixture where the opt-in cost-guided merge-search
      policy uses AABB-normalized merge-excess as a decision-making cost and compares old/new
      diagnostic accounting. This entry intentionally has no config because the mesh is an
      in-memory fixture defined in source.
    claims_supported:
      - focused CPD-like cost-guided merge-search smoke only
      - no collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
  - id: cpd-like-expected-failure-synthetic-workbench
    status: complete
    command: PYTHONPATH=src python -m primitive_collision_compiler.cli --run-cpd-like-expected-failure-workbench
    record: docs/records/2026-05-15-cpd-synthetic-expected-failure-workbench.md
    purpose: >
      Run a command-only deterministic expected-failure workbench that checks whether known
      CPD-paper gaps remain visible as expected diagnostic flags. This entry intentionally has no
      config because the meshes are in-memory fixtures defined in source.
    claims_supported:
      - expected CPD-like limitation flags on deterministic synthetic fixtures only
      - no collision-quality, benchmark, broad asset/task, general failure-detection, paper-faithful optimization, or full CPD reproduction claim
  - id: cpd-like-capped-cylinder-proxy
    status: complete
    config: configs/experiments/cpd_like_capped_cylinder_proxy.yaml
    record: docs/records/2026-05-15-cpd-capped-cylinder-proxy.md
    purpose: >
      Run an opt-in offline capped-cylinder geometry proposal proxy and record the reduced
      unsupported paper primitive vocabulary gap in the CPD-like objective report.
    claims_supported:
      - offline geometry-only capped-cylinder proposal proxy smoke only
      - no Newton support, collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
  - id: newton-native-fitting-synthetic-comparison
    status: complete
    config: configs/experiments/newton_native_fitting_comparison.yaml
    command: PYTHONPATH=src python -m primitive_collision_compiler.cli --config configs/experiments/newton_native_fitting_comparison.yaml --run-newton-native-fitting-comparison
    record: docs/records/2026-05-15-newton-native-fitting-comparison.md
    purpose: >
      Run an opt-in deterministic synthetic comparison between the legacy `box`/`sphere`/`capsule`
      subset and the six-kind Newton-native subset, while pointing to the separate bed/Franka
      real-USD probe comparison config.
    claims_supported:
      - synthetic native primitive fitting comparison only
      - bed and Franka evidence lives in the separate real-USD probe comparison records
      - no collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
  - id: synthetic-native-selection-audit
    status: complete
    config: configs/experiments/newton_native_fitting_comparison.yaml
    command: PYTHONPATH=src python -m primitive_collision_compiler.cli --config configs/experiments/newton_native_fitting_comparison.yaml --run-newton-native-fitting-comparison
    record: docs/records/2026-05-15-synthetic-native-selection-audit.md
    purpose: >
      Record candidate weighted-volume audit tables for the deterministic synthetic native fitting
      fixtures, explaining why the six-kind lane selects cylinder, cone, and ellipsoid under the
      current surrogate primitive-choice rule.
    claims_supported:
      - synthetic native primitive selection audit on toy meshes only
      - no collision-quality, benchmark, real-USD improvement, paper-faithful optimization, or full CPD reproduction claim
  - id: bed-franka-native-probe-comparison
    status: complete
    config: configs/experiments/bed_franka_native_probe_comparison.yaml
    command: NEWTON_SOURCE_DIR=/cpfs/user/zhuzihou/dev/newton PYTHONPATH=src /cpfs/user/zhuzihou/conda-managed/envs/physics-primitive-newton-py310/bin/python -m primitive_collision_compiler.cli --config configs/experiments/bed_franka_native_probe_comparison.yaml --run-real-usd-native-task-comparison
    record: docs/records/2026-05-15-real-usd-native-task-comparison.md
    purpose: >
      Run the final contact-gated drop/settle plus sphere-rain task-smoke comparison for capped
      bed and capped Franka first-mesh old/new lanes. Offline fitting and contact-canary evidence
      are recorded separately.
    claims_supported:
      - capped bed and capped Franka real-USD diagnostic smoke only
      - current bed native lane still selects boxes; current Franka native lane selects 29 boxes plus 3 cylinders under the surrogate
      - no native primitive improvement claim from this selection change
      - no collision-quality, benchmark, broad asset/task, paper-faithful optimization, or full CPD reproduction claim
  - id: real-usd-candidate-loss-diagnosis
