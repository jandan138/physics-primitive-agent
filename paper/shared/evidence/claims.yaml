schema_version: 1
claims:
  - id: bed_franka_cylinder_mechanism
    status: recorded
    section: experiments
    claim: >-
      For the capped recorded scope, the bed selected-cylinder package fails drop/settle as a
      full-compound body-state effect while the same cylinder passes in isolation and recorded
      Franka cylinder packages pass in smaller contexts.
    evidence_source: >-
      docs/records/2026-05-22-cylinder-goal-completion-audit-after-contact-closure.md;
      paper/shared/evidence/results_manifest.yaml#bed_franka_cylinder_mechanism
    excluded_from_paper_metrics: false
    paper_scope: mechanism_study_not_broad_cylinder_stability
  - id: package_body_state_guard_task_path
    status: recorded
    section: method
    claim: >-
      An opt-in package body-state guard falls back only the flagged capped bed package while
      keeping the unflagged Franka cylinder package in the recorded Newton task smoke.
    evidence_source: >-
      docs/records/2026-05-22-package-body-state-guard-task-path.md;
      paper/shared/evidence/results_manifest.yaml#package_body_state_guard_task_path
    excluded_from_paper_metrics: false
    paper_scope: diagnostic_guard_prototype
  - id: bed_box_contact_throughput_microbenchmark
    status: recorded
    section: experiments
    claim: >-
      In one bed-aligned collision-only pressure scene, native 32-box primitives achieved 2.21x
      generated-contact throughput versus same-count convex64 mesh proxies with about 5.3%
      collision-only wall-time reduction.
    evidence_source: >-
      docs/records/2026-05-22-bed-aligned-box-primitive-contact-throughput.md;
      paper/shared/evidence/results_manifest.yaml#bed_box_contact_throughput_microbenchmark
    excluded_from_paper_metrics: false
    paper_scope: collision_only_single_scene_not_full_simulation_speedup
  - id: phase0_multi_asset_benchmark
    status: recorded_scoped
    section: experiments
    claim: >-
      A scoped Phase 0 diagnostic run records accept, fallback, and failure outcomes plus a zero
      dependency-gap count for five materialized GRScenes rigid assets under bounding-primitive,
      CPD-style first-mesh, CoACD convex-mesh, and V-HACD candidate packages with Newton contact,
      drop/settle, stack-or-slide, and sphere-rain probes. V-HACD generates packages for all five
      selected assets and records probe failures on bowl/cup/tray as simulation-check rejections
      rather than dependency gaps. The same report separately includes one Franka link-aware
      package with all detected links covered, zero cross-link merges, one meshless placeholder
      link, one Franka USD articulation smoke asset, and one generated-package Franka task smoke
      that consumes all generated package primitives.
    evidence_source: >-
      docs/records/2026-05-26-phase0-vhacd-runtime-followup.md;
      docs/records/2026-05-26-link-aware-robot-package-generation.md;
      docs/records/2026-05-26-generated-package-robot-task-probe.md;
      paper/shared/evidence/results_manifest.yaml#phase0_multi_asset_benchmark
    excluded_from_paper_metrics: false
    paper_scope: >-
      scoped_diagnostic_not_broad_benchmark_superiority_not_all_vhacd_success_not_whole_robot_quality
    next_required_step: >-
      Preserve the recorded V-HACD probe failures as diagnostic outcomes unless a bounded
      baseline-sensitivity rerun is needed; broaden generated-package robot task checks before
      claiming complete Phase 0 coverage.
  - id: franka_articulation_smoke
    status: recorded_scoped
    section: experiments
    claim: >-
      The Phase 0 follow-up report includes a Franka USD articulation smoke that passes joint-tree
      import, short gravity hold, and simple kinematic trajectory checks.
    evidence_source: >-
      docs/records/2026-05-26-phase0-vhacd-runtime-followup.md;
      docs/records/2026-05-26-link-aware-robot-package-generation.md;
      paper/shared/evidence/results_manifest.yaml#phase0_multi_asset_benchmark
    excluded_from_paper_metrics: false
    paper_scope: articulation_import_smoke_not_whole_robot_validation
    next_required_step: Broaden generated-package robot task probes before whole-robot wording.
  - id: franka_generated_package_robot_task_smoke
    status: recorded_scoped
    section: experiments
    claim: >-
      The Phase 0 follow-up report includes a generated-package Franka task smoke where all 12
      link-aware package primitives are attached to Newton bodies and consumed during a short
      gravity-hold and kinematic trajectory probe with source USD shapes suppressed.
    evidence_source: >-
      docs/records/2026-05-26-generated-package-robot-task-probe.md;
      paper/shared/evidence/results_manifest.yaml#phase0_multi_asset_benchmark
    excluded_from_paper_metrics: false
    paper_scope: generated_package_consumption_smoke_not_whole_robot_validation
    next_required_step: Broaden to more robot assets or contact-operation robot smokes.
