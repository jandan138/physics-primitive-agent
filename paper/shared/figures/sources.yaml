schema_version: 1
figures:
  - id: pipeline_schematic
    status: generated-hybrid-visual-composition
    mode: hybrid_newton_visual_composition
    output: generated/pipeline_schematic_ai_slot.pdf
    generated_manifest: assets/fig1_ai_slots/manifest.yaml
    evidence: docs/design/system-architecture.md
    claim_boundary: Exposition only; not experimental evidence.
    note: >-
      Fig. 1 protocol schematic showing asset intake, candidate package generation, Newton
      diagnostics, and decision reporting for one recorded Phase 0 Franka smoke asset/package.
      It explains the workflow and does not provide whole-robot collision-quality evidence,
      manipulation evidence, or new experimental evidence.
    source_artifacts:
      - assets/fig1_ai_slots/overview_candidate_01.png
      - assets/fig1_franka_rtx_slots/manifest.yaml
      - assets/fig1_franka_rtx_slots/asset_intake_franka_rtx.png
      - assets/fig1_franka_rtx_slots/asset_intake_franka_rtx.json
      - assets/fig1_franka_rtx_slots/candidate_package_franka_rtx.png
      - assets/fig1_franka_rtx_slots/candidate_package_franka_rtx.json
      - assets/fig1_franka_rtx_slots/newton_diagnostics_franka_rtx.png
      - assets/fig1_franka_rtx_slots/newton_diagnostics_franka_rtx.json
      - assets/fig1_ai_slots/decision_report_ai.png
      - generated/pipeline_schematic_ai_slot.png
      - generated/pipeline_schematic_ai_slot.pdf
  - id: phase0_asset_package_overlays
    status: generated
    output: generated/phase0_asset_package_overlays.pdf
    generated_manifest: generated/accv_visuals_manifest.json
    evidence: >-
      reports/generated/phase0_baseline/phase0_grscenes_rigid_plus_franka_newton_2026-05-26.json;
      assets/manifests/phase0_assets.yaml
    note: >-
      Deterministic mesh/package overlay figure for selected Phase 0 rigid assets. Generated from
      repo-local ignored asset mirrors and report package fields; high-count lanes draw representative
      subsets with visible overflow markers while counts stay tied to the recorded package; raw assets
      stay uncommitted.
  - id: phase0_asset_package_control_overlays
    status: generated
    output: generated/phase0_asset_package_control_overlays.pdf
    generated_manifest: generated/accv_visuals_manifest.json
    evidence: >-
      reports/generated/phase0_baseline/phase0_grscenes_rigid_plus_franka_newton_2026-05-26.json;
      assets/manifests/phase0_assets.yaml
    note: >-
      Deterministic mesh/package overlay figure for the stackable tray and precision negative-control
      keyboard rows. The keyboard input column uses aggregated USD default/render mesh prims for
      recognizability; high-count keyboard package cells draw a labeled representative local marker
      with visible overflow counts while remaining tied to recorded report package fields.
  - id: phase0_collision_probe_scenes
    status: generated
    output: generated/phase0_collision_probe_scenes.pdf
    generated_manifest: generated/accv_visuals_manifest.json
    evidence: >-
      reports/generated/phase0_baseline/phase0_grscenes_rigid_plus_franka_newton_2026-05-26.json;
      docs/records/2026-05-26-phase0-vhacd-runtime-followup.md
    note: >-
      Diagnostic collision-scene render panels for bowl, cup, tray, and related probe outcomes.
      These are evidence visualizations, not photorealistic rendering claims.
  - id: phase0_outcome_matrix
    status: generated
    output: generated/phase0_outcome_matrix.pdf
    generated_manifest: generated/accv_visuals_manifest.json
    evidence: reports/generated/phase0_baseline/phase0_grscenes_rigid_plus_franka_newton_2026-05-26.json
    note: Accept/failure/fallback/not-applicable matrix derived from recorded outcomes.
  - id: bed_franka_mechanism_diagnostic
    status: generated-visual-composition
    mode: visual_composition
    output: generated/bed_franka_mechanism_diagnostic.pdf
    generated_manifest: assets/fig2_mechanism_ai_slots/manifest.yaml
    evidence: docs/records/2026-05-22-cylinder-goal-completion-audit-after-contact-closure.md
    claim_boundary: Exposition only; not experimental evidence.
    note: >-
      Fig. 2 mechanism figure showing isolated-primitive acceptance, full-package failure,
      and the COM/inertia diagnostic path for the recorded capped bed/Franka mechanism
      records. Pass/fail labels and speeds remain tied to those records; the figure does
      not add new render evidence.
    source_artifacts:
      - assets/fig2_mechanism_ai_slots/manifest.yaml
      - assets/fig2_mechanism_ai_slots/isolated_target_pass_ai.png
      - assets/fig2_mechanism_ai_slots/full_package_fail_ai.png
      - assets/fig2_mechanism_ai_slots/mechanism_audit_ai.png
      - generated/bed_franka_mechanism_diagnostic.png
      - generated/bed_franka_mechanism_diagnostic.pdf
  - id: franka_link_aware_rtx_task_scene
    status: generated-rtx
    output: generated/franka_link_aware_rtx_task_scene.pdf
    generated_manifest: assets/franka_rtx_task_scene/franka_link_aware_rtx_task_scene.json
    evidence: >-
      docs/records/2026-05-26-link-aware-robot-package-generation.md;
      docs/records/2026-05-26-generated-package-robot-task-probe.md
    note: >-
      RTX-rendered visual context for one recorded Franka link-aware generated-package task smoke.
      It supports generated package consumption exposition only, not whole-robot collision-quality or manipulation evidence.
    source_artifacts:
      - assets/fig1_franka_rtx_slots/newton_diagnostics_franka_rtx.png
      - assets/fig1_franka_rtx_slots/newton_diagnostics_franka_rtx.json
      - assets/franka_rtx_task_scene/franka_link_aware_rtx_task_scene.json
      - generated/franka_link_aware_rtx_task_scene.png
      - generated/franka_link_aware_rtx_task_scene.pdf
