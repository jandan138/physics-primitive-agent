asset:
  id: newton_native_fitting_comparison
  path: assets/manifests/cpd_like_smoke_assets.yaml
task:
  primary: native_primitive_fitting_comparison
compile:
  method: cpd_like_baseline
  max_primitives: 32
  allowed_fallback:
    - convex_hull
  verify:
    - synthetic_native_fitting_comparison
    - bed_usd_cpd_like_geometry_scope
    - franka_usd_cpd_like_geometry_scope
  keep_visual: false
cpd_like:
  paper: Convex Primitive Decomposition for Collision Detection
  asset_manifest: assets/manifests/cpd_like_smoke_assets.yaml
  asset_roles:
    - bed_dev_smoke
    - franka_import_smoke
  legacy_primitive_subset:
    - box
    - sphere
    - capsule
  native_primitive_subset:
    - box
    - sphere
    - capsule
    - cylinder
    - cone
    - ellipsoid
  primitive_subset:
    - box
    - sphere
    - capsule
    - cylinder
    - cone
    - ellipsoid
  unsupported_primitives:
    - capped_cylinder
    - frustum
    - trapezoidal_prism
  max_source_faces_by_role:
    bed_dev_smoke: 256
    franka_import_smoke: 128
  component_merge: virtual_pairwise
  excess_volume_threshold_fraction: 1.0
  report_merge_trace: summary
  claim_boundary: native_fitting_comparison_not_collision_quality_validation
native_fitting_comparison:
  stage: cpd_like_newton_native_fitting_comparison
  synthetic_cases:
    - cylindrical_rod
    - tapered_cone
    - ellipsoid_blob
  real_usd_roles:
    - bed_dev_smoke
    - franka_import_smoke
  real_usd_status: scope_declared_not_run
  claim_boundary: native_fitting_comparison_not_collision_quality_validation
  evidence_level: offline_synthetic_native_fitting_comparison_smoke
newton:
  source_dir: $NEWTON_SOURCE_DIR
  expected_remote: https://github.com/newton-physics/newton.git
  runtime_stage: source_import_check
report:
  output_dir: reports/generated/newton_native_fitting_comparison
  evidence_level: offline_synthetic_native_fitting_comparison_smoke
