asset:
  path: assets/manifests/phase0_assets.yaml
  id: phase0_asset_manifest
  provenance: planned_manifest
task:
  primary: phase0_simulation_checked_diagnostic
  probes:
    - body_state_drop_settle
    - stack_or_slide
    - sphere_rain
    - link_boundary_audit
    - articulation_smoke_if_robot
    - precision_rejection
compile:
  method: simulation_checked_primitive_candidates
  max_primitives: 16
  allowed_fallback:
    - coacd
    - vhacd
    - sdf
    - convex_mesh
    - manual_review
  verify:
    - body_state_drop_settle
    - stack_or_slide
    - sphere_rain
    - link_boundary_audit
    - articulation_smoke_if_robot
    - precision_rejection
  keep_visual: true
phase0_defaults:
  asset_manifest: assets/manifests/phase0_assets.yaml
  articulated_robot_manifest: assets/manifests/franka_usd_smoke_assets.yaml
  articulated_robot_roles:
    - franka_import_smoke
  seeds: 3
  duration_seconds: 2
  baselines:
    - id: bounding_primitive
      method: bbox_or_sphere
      required: true
      status: specified
    - id: single_convex_hull
      method: single_convex_hull
      required: true
      status: specified
    - id: coacd_or_vhacd_if_available
      method: coacd_or_vhacd
      required: false
      fallback_if_unavailable: record_dependency_gap
      status: best_effort
    - id: vhacd_if_available
      method: vhacd
      required: false
      fallback_if_unavailable: record_dependency_gap
      status: best_effort
    - id: cpd_style_primitive_candidate_if_available
      method: cpd_style_primitive_candidate
      required: false
      fallback_if_unavailable: record_dependency_gap
      status: best_effort
  cpd_like:
    primitive_subset: [box, sphere, capsule]
    component_merge: virtual_pairwise
    merge_search_policy: topology_then_virtual
    report_merge_trace: summary
    max_source_faces_by_role:
      rigid_prop: 64
      container: 256
      contact_affordance: 192
      stackable: 140
      precision_negative_control: 64
  convex_decomposition:
    preferred_backends: [coacd, vhacd]
    max_hulls: 16
    timeout_seconds: 120
    coacd_threshold: 0.5
    coacd_mcts_nodes: 20
    coacd_mcts_iterations: 5
    coacd_mcts_max_depth: 1
    coacd_merge: false
    vhacd_max_vertices_per_hull: 64
  probes:
    body_state_drop_settle:
      initial_conditions:
        height_m: 0.25
        plane: static
        initial_velocity_mps: [0.0, 0.0, 0.0]
      solver:
        engine: newton
        settings: default_recorded
        duration_seconds: 2
        seeds: 3
      metrics:
        - body_state_delta
        - step_time
        - contact_count_p95
        - penetration_or_jitter
        - final_speed_label
      pass_condition: complete_and_label_body_state_or_rest_failures
    stack_or_slide:
      initial_conditions:
        support: static_plane_or_box
        lateral_velocity_mps: 0.1
        probe_half_extents_m: [0.05, 0.05, 0.05]
        spawn_clearance_m: 0.01
      solver:
        engine: newton
        settings: default_recorded
        duration_seconds: 2
        seeds: 3
        substeps: 4
        iterations: 4
      metrics:
        - displacement
        - contact_count_p95
        - penetration_or_jitter
      pass_condition: complete_and_label_support_or_slide_failures
    sphere_rain:
      initial_conditions:
        sphere_count: 32
        sphere_radius_m: 0.025
        spawn_pattern: fixed_grid_or_seeded_random
      solver:
        engine: newton
        settings: default_recorded
        duration_seconds: 2
        seeds: 3
      metrics:
        - step_time
        - contact_count_p95
        - penetration_or_jitter
      pass_condition: complete_and_label_blocked_openings_or_contact_stress
    link_boundary_audit:
      initial_conditions:
        asset_role: articulated_robot_if_present
        simulation_required: false
      solver:
        engine: newton
        settings: compile_time_check
        duration_seconds: 0
        seeds: 1
      metrics:
        - cross_link_merge_count
        - per_link_primitive_count
      pass_condition: zero_cross_link_merges
    articulation_smoke_if_robot:
      initial_conditions:
        asset_role: articulated_robot_if_present
        joint_command: simple_scripted_trajectory
        mesh_approximation: bounding_box
        collapse_fixed_joints: true
        enable_self_collisions: false
      solver:
        engine: newton
        settings: default_recorded
        duration_seconds: 0.25
        seeds: 1
        substeps: 2
        iterations: 2
      metrics:
        - joint_tree_import
        - gravity_hold_drift
        - trajectory_completion
        - self_collision_sanity
        - end_effector_pose_error
      pass_condition: complete_and_label_articulation_failures
    precision_rejection:
      initial_conditions:
        asset_role: precision_negative_control
        simulation_required: false
      solver:
        engine: newton
        settings: optional_if_task_configured
        duration_seconds: 0
        seeds: 1
      metrics:
        - rejection_or_fallback_decision
      pass_condition: reject_or_fallback
  required_metrics:
    - primitive_or_hull_count
    - fallback_ratio
    - generation_failure_rate
    - body_state_delta
    - step_time
    - contact_count_p95
    - displacement
    - penetration_or_jitter
    - link_boundary_status
    - articulation_drift
report:
  output_dir: reports/generated/phase0_baseline
  record_template: docs/records/README.md
