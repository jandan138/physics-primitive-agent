  max_primitives: 32
  allowed_fallback:
    - convex_hull
  verify:
    - newton_import
    - newton_contact_smoke
  keep_visual: false
cpd_like:
  paper: Convex Primitive Decomposition for Collision Detection
  asset_manifest: assets/manifests/cpd_like_smoke_assets.yaml
  asset_role: bed_dev_smoke
  primitive_subset:
    - sphere
    - capsule
    - box
  unsupported_primitives:
    - capped_cylinder
    - frustum
    - trapezoidal_prism
  max_source_faces: 256
  decomposition_stage: cpd_like_face_merge_smoke
  claim_boundary: internal_baseline_not_reproduction_claim
newton:
  source_dir: $NEWTON_SOURCE_DIR
  expected_remote: https://github.com/newton-physics/newton.git
  runtime_stage: source_import_check
newton_diagnostic:
  probe_type: contact_canary
  device: cpu
  max_canaries_per_type: 1
  claim_boundary: contact_canary_only_not_collision_quality
report:
  output_dir: reports/generated/cpd_like_baseline
  evidence_level: newton_contact_canary_smoke
